version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        emit_json_tags: true
        package: "repository"
        out: "repository"
        sql_package: "pgx/v5"
        overrides:

        - db_type: "uuid"
          nullable: true
          go_type:
            import: "github.com/google/uuid"
            type: "UUID"
        - db_type: "uuid"
          nullable: false
          go_type:
            import: "github.com/google/uuid"
            type: "UUID"

        - db_type: "timestamptz"
          nullable: true
          go_type:
            import: "time"
            type: "Time"
        - db_type: "timestamptz"
          nullable: false
          go_type:
            import: "time"
            type: "Time"

        - db_type: "text"
          nullable: true
          go_type:
            type: "string"
        - db_type: "text"
          nullable: false
          go_type:
            type: "string"